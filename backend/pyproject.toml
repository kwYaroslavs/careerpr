[project]
name = "careerpr"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]", "pydantic>=2.7", "pydantic-settings", "sqlalchemy>=2", "alembic", "pymupdf", "httpx"]
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
markers = ["live: calls real LLM, manual only"]
addopts = "-m 'not live'"
testpaths = ["tests"]
