name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Setup environment and run check via Makefile
        run: |
          make setup
          make check
